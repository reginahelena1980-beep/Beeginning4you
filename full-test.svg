
<svg viewBox="0 0 248 108" xmlns="http://www.w3.org/2000/svg" width="800" height="350">
  <rect width="100%" height="100%" fill="#FBF9F4"/>
  
  <!-- Flight path -->
  <path
    d="M 144.4 76.5 C 153 62, 168 55, 179 58 C 188 61, 195 52, 201.5 39.1"
    stroke="#181B1E"
    stroke-width="3.2"
    fill="none"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
  
  <!-- Bee group at (214, 30) tilted at -36 deg -->
  <g transform="translate(214, 30) rotate(-36)">
    <!-- 1. Stinger: sharp cone at posterior tip -->
    <path
      d="M -15.5,0 L -11.5,-3 C -11.2,-1 -11.2,1 -11.5,3 Z"
      fill="#181B1E"
    />

    <!-- 2. Abdomen Stripe 1 (black band) -->
    <path
      d="M -8.5,-5.2 C -6.5,-5.6 -4.5,-5.8 -3.5,-5.8 L -3.5,5.8 C -4.5,5.8 -6.5,5.6 -8.5,5.2 C -9.2,2.5 -9.2,-2.5 -8.5,-5.2 Z"
      fill="#181B1E"
    />

    <!-- 3. Thorax / Stripe 2 (black band) -->
    <path
      d="M 0.5,-6.7 C 2.5,-6.9 4.5,-6.8 6,-6.3 L 6,6.3 C 4.5,6.8 2.5,6.9 0.5,6.7 C -0.3,4.5 -0.3,-4.5 0.5,-6.7 Z"
      fill="#181B1E"
    />

    <!-- 4. Head: solid rounded dome at the front -->
    <path
      d="M 8.5,-5.2 C 10.5,-4.2 13.8,-2.4 13.8,0 C 13.8,2.4 10.5,4.2 8.5,5.2 C 7.8,2.5 7.8,-2.5 8.5,-5.2 Z"
      fill="#181B1E"
    />

    <!-- 5. Two Antennae with cute rounded dots at the tips -->
    <path
      d="M 12,-2 C 13.5,-6.5 13.2,-11 10.5,-14"
      stroke="#181B1E"
      stroke-width="1.8"
      fill="none"
      stroke-linecap="round"
    />
    <circle cx="10.5" cy="-14" r="1.8" fill="#181B1E" />

    <path
      d="M 13.2,0.5 C 16,-1.5 19.5,-3.5 21.5,-2"
      stroke="#181B1E"
      stroke-width="1.8"
      fill="none"
      stroke-linecap="round"
    />
    <circle cx="21.5" cy="-2" r="1.8" fill="#181B1E" />

    <!-- 6. Wings: infinity symbol (figure 8) across the thorax -->
    <path
      d="M 2.5,-2.5 C -0.5,-8 -6.5,-16 -13,-13 C -18.5,-10 -13,-1.5 2.5,-2.5 C 11,-3 19.5,2.5 17.5,9 C 15,14.5 7,6 2.5,-2.5 Z"
      stroke="#181B1E"
      stroke-width="3"
      fill="none"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
  </g>
</svg>
